# Plex, the common linuxserver.io way: host networking for discovery and a
# GPU passed through for hardware transcoding.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
    volumes:
      - ./config:/config
      - /mnt/media/tv:/tv
      - /mnt/media/movies:/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
