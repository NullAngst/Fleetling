{{if .Err}}<span class="muted">Stats unavailable: {{.Err}}</span>{{else}}{{with .Stats}}<div class="stat"><span class="k">CPU</span><strong class="mono">{{pct .CPUPercent}}</strong></div><div class="stat"><span class="k">Memory</span><strong class="mono">{{bytes .MemUsage}}</strong>{{if .MemLimit}} <span class="muted mono">of {{bytes .MemLimit}}</span><meter min="0" max="{{.MemLimit}}" value="{{.MemUsage}}" high="{{.MemLimit}}" aria-label="Memory use"></meter>{{end}}</div><div class="stat"><span class="k">Network</span><span class="mono">{{bytes .RxBytes}} in, {{bytes .TxBytes}} out</span></div><div class="stat"><span class="k">Processes</span><span class="mono">{{.Pids}}</span></div>{{end}}{{end}}
